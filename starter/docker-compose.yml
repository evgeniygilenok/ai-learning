services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_course
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agent_course"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - agent_course_postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.18.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - agent_course_qdrant:/qdrant/storage

volumes:
  agent_course_postgres:
  agent_course_qdrant:
